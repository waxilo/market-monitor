[package]
name = "market-monitor"
version = "0.1.0"
description = "Market Monitor 桌面端：Gate 现货/永续行情、托盘常驻、迷你悬浮窗"
authors = ["waxilo"]
license = ""
repository = "https://github.com/waxilo/market-monitor"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
# 应用内更新：官方插件负责「读通道 manifest + 按平台安装」，加速站与签名自验在 update.rs 里包一层。
# 关掉默认的 rustls-tls，与下面的 reqwest 统一走 native-tls（Windows schannel / macOS
# Security.framework）—— 一条 TLS 栈，不引入 rustls + ring 的额外 C 构建。
# `zip` 是 macOS 解开 `.app.tar.gz` 必需的（flate2 + tar 在它的 feature 里）。
tauri-plugin-updater = { version = "2", default-features = false, features = [
    "native-tls",
    "system-proxy",
    "zip",
] }
# 更新下载：native-tls 走 Windows schannel（不引入 openssl/aws-lc 的 C 构建），
# system-proxy 自动沿用 Windows 系统代理，与浏览器行为一致
reqwest = { version = "0.13", default-features = false, features = [
    "native-tls",
    "system-proxy",
] }
url = "2"
# 安装包的 minisign 签名自验（与插件内部相同的校验实现）
minisign-verify = "0.2"
base64 = "0.22"

# 悬浮窗与 Windows 任务栏同为 topmost：点击任务栏时系统会把任务栏提到 topmost 组最前，
# 盖住悬浮窗，只能自己按 z 序轮询、被压住时用 `SetWindowPos` 重新置顶
# （tao 的 `set_always_on_top` 有 flags 去重，重复调用根本走不到 `SetWindowPos`）。
# 为什么非得直接调 Win32，见 src/lib.rs 的 `taskbar` 模块。
# 版本与 tauri 自己用的那份对齐，复用已有依赖，不额外拉新版本。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
