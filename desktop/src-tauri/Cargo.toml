[package]
name = "market-monitor"
version = "0.1.0"
description = "Market Monitor 桌面端：Gate 现货/永续行情、托盘常驻、迷你悬浮窗"
authors = ["waxilo"]
license = ""
repository = "https://github.com/waxilo/market-monitor"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
# GitHub 更新：native-tls 走 Windows schannel（不引入 openssl/aws-lc 的 C 构建），
# system-proxy 自动沿用 Windows 系统代理，与浏览器行为一致
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "native-tls",
    "system-proxy",
] }
sha2 = "0.10"
