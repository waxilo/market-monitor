name: Release

on:
  push:
    tags:
      # 应用内更新用「去掉 v 前缀的 tag」与 versionName 比较，所以裸版本号 tag 是本项目的主约定；
      # 两种写法都放行，否则发版时这个工作流压根不会被触发。
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build debug APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use Android SDK from runner image
        # 见 ci.yml 说明：避开 setup-android 对 legacy `tools` 包的失败依赖
        run: echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon assembleDebug

      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          # 直接产出带版本号的包名，边车文件必须叫 `<apk>.sha256`，App 端按后缀配对。
          APK="dist/market-monitor-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" | awk '{print $1}' > "$APK.sha256"
          ls -l dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/market-monitor-$GITHUB_REF_NAME.apk" \
            "dist/market-monitor-$GITHUB_REF_NAME.apk.sha256" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag || gh release view "$GITHUB_REF_NAME"
