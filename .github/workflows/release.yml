name: Release

on:
  push:
    tags:
      # tag 现在**只是触发器**：发布目标永远是固定通道 `android-latest`，
      # 版本号由产物名承载（App 从 `market-monitor-<版本>.apk` 里读，不再看 tag）。
      # 裸版本号是本项目的主约定，`v` 前缀也放行，否则发版时这个工作流压根不会被触发。
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

# 两端各自只有一个**固定 tag 的通道 Release**：发新版只替换里面的产物，不新建 Release。
# 共用脚本 .github/scripts/publish-channel.sh（存在就换产物、不存在才建）。
env:
  RELEASE_REPO: waxilo/market-monitor
  CHANNEL_TAG: android-latest

jobs:
  release:
    name: Build signed release APK and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use Android SDK from runner image
        # 见 ci.yml 说明：避开 setup-android 对 legacy `tools` 包的失败依赖
        run: echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        # 签名必须逐版本一致，否则应用内更新永远装不上（INSTALL_FAILED_UPDATE_INCOMPATIBLE）。
        # 密钥来自仓库 Secrets，绝不落进仓库；这里只解码到 runner 的临时目录。
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 KEYSTORE_BASE64，无法保证签名一致。请先配置签名 Secrets。"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/signing/release.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature is consistent with the pinned key
        # 用与 Secrets 同一把密钥的证书指纹做断言：签名跑偏时在这里就红，而不是等用户装不上。
        # 必须用 apksigner：AGP 默认只做 v2/v3 签名，APK 里没有 META-INF/*.RSA，
        # `keytool -printcert -jarfile` 会报「不是已签名的 jar 文件」。
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          # 期望指纹：本仓库固定的发布密钥证书 SHA-256（见 README「签名」章节）
          EXPECTED="cf2e20c74d1edd4d1fb290afee3b68ed1a18e20ac70a89e4ab5c43ec2d52f034"
          APKSIGNER="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)/apksigner"
          echo "--- apksigner verify ---"
          "$APKSIGNER" verify --print-certs "$APK"
          # 取「Signer #1 certificate SHA-256 digest」，去掉冒号转小写后比对
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep 'certificate SHA-256 digest' | head -1 \
            | sed 's/.*digest: *//' | tr -d ':\r' | tr 'A-Z' 'a-z')
          echo "apk cert sha256: ${ACTUAL:-<empty>}"
          echo "expected       : $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK 签名与固定密钥不符，应用内更新会装不上。"
            exit 1
          fi

      - name: 确定版本号（tag 去掉 v 前缀；手动触发时读 build.gradle.kts）
        id: version
        run: |
          set -euo pipefail
          # 版本号必须与 build.gradle.kts 一致：不一致就是忘了改 versionName，
          # 装出来的包 versionCode/Name 还是旧的，应用内更新会反复提示同一个版本。
          DECLARED=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$DECLARED"
          fi
          if [ "$V" != "$DECLARED" ]; then
            echo "::error::tag 版本（$V）与 build.gradle.kts 的 versionName（$DECLARED）不一致"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "本次版本号：$V"

      - name: Stage artifacts
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          mkdir -p dist
          # ⚠️ 产物名是**版本号的唯一载体**（通道 tag 固定，App 从文件名里读版本）——
          # 约定 `market-monitor-<版本>[-<abi>].apk`，改名前先看
          # VersionCompare.versionFromAssetName 与 README「发版流程」。
          # 边车必须叫 `<apk>.sha256`，App 端按后缀配对。
          APK="dist/market-monitor-$V.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" | awk '{print $1}' > "$APK.sha256"
          ls -l dist

      - name: 发布到更新通道（固定 tag，原地换产物）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          NOTES="$RUNNER_TEMP/mm-android-notes.md"
          {
            echo "Android 应用内更新的固定通道：tag $CHANNEL_TAG 永远不变，每次发版只替换里面的产物、不新建 Release。"
            echo
            echo "最新版本：$V"
          } > "$NOTES"
          bash "$GITHUB_WORKSPACE/.github/scripts/publish-channel.sh" \
            "$CHANNEL_TAG" "Android 更新通道" "$NOTES" \
            "$GITHUB_WORKSPACE/android/dist" "$RELEASE_REPO"
