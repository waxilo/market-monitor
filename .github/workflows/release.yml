name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build debug APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use Android SDK from runner image
        # 见 ci.yml 说明：避开 setup-android 对 legacy `tools` 包的失败依赖
        run: echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon assembleDebug

      - name: Compute checksum
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          sha256sum "$APK" | awk '{print $1}' > app-debug.apk.sha256
          cat app-debug.apk.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/debug/app-debug.apk#market-monitor-$GITHUB_REF_NAME.apk \
            app-debug.apk.sha256 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag || gh release view "$GITHUB_REF_NAME"
